# ===========================================================================
# Pinned corpus records.
#
# Relevance-ranked search over arXiv/Europe PMC does NOT reliably surface the
# canonical primary source for a topic - a query for "Swin UNETR brain tumor
# segmentation" frequently ranks citing papers above the original. For sources
# that must be present, we pin the identifier and resolve it directly.
#
# Three entry kinds:
#   arxiv.ids  - resolved via the arXiv id_list endpoint (guaranteed abstract)
#   crossref   - resolved via Crossref (metadata; abstract only if deposited)
#   records    - author-supplied text, written verbatim in this file
# ===========================================================================

