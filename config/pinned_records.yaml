  # retriever. SIGIR 2009; not on arXiv, so it is pinned by DOI.
  - doi: "10.1145/1571941.1572114"
    stratum: rag
    topic: hybrid_sparse_dense
    note: "Cormack, Clarke & Buettcher (SIGIR 2009). Primary source for Reciprocal Rank Fusion."

  # The repository owner's own Q1 publication. Included so that NeuroRAG can
  # answer questions about the author's prior work and cite it correctly.
  # Elsevier does not deposit the abstract with Crossref, so a curated
  # author-supplied record below supplies the text; the DOI record supplies
  # verified bibliographic metadata.
  - doi: "10.1016/j.imavis.2025.105491"
    stratum: clinical
    topic: own_publication
    note: "Rahim, Ahmad, Ullah, Bedi & Jung (2025), Image and Vision Computing 157:105491."

records:
  # -----------------------------------------------------------------------
  # AUTHOR-SUPPLIED RECORD
  #
  # Provenance matters here. This record's bibliographic metadata was verified
  # against Crossref (DOI 10.1016/j.imavis.2025.105491), but the body text is a
  # short description supplied by the author rather than the publisher's
  # abstract, because no open copy is deposited with Europe PMC, Crossref or
  # Semantic Scholar.
  #
  # It is deliberately conservative: it states only what the title and scope of
  # the work establish, and contains no unverified performance numbers. When a
  # citation resolves to this record the UI shows the `author_supplied_summary`
  # tag so a reader is never misled into thinking it is verbatim source text.
  #
  # TO REPLACE WITH FULL TEXT: drop the accepted/published PDF into
  # data/corpus/inbox/ and re-run `make corpus`. The PDF loader will ingest the
  # real full text and `merge_duplicates` prefers the record with more text.
  # -----------------------------------------------------------------------
  - doc_id: "manual:rahim2025-mci-ad-multiview"
    title: "Early progression detection from MCI to AD using multi-view MRI for enhanced assisted living"
    authors: ["Nasir Rahim", "Naveed Ahmad", "Waseem Ullah", "Jatin Bedi", "Younhyun Jung"]
    venue: "Image and Vision Computing"
    year: 2025
    doi: "10.1016/j.imavis.2025.105491"
    url: "https://doi.org/10.1016/j.imavis.2025.105491"
    stratum: clinical
    topic: own_publication
    source: author_supplied
    tags: [own_publication, multi_view_mri, q1_journal]
    note: >-
      Author-supplied summary. Bibliographic metadata verified via Crossref;
      body text supplied by the author because the publisher abstract is not
      openly deposited. Replace with the publisher PDF via data/corpus/inbox/.
    text: >-
      ## Scope

      This work addresses early detection of progression from mild cognitive
      impairment (MCI) to Alzheimer's disease (AD) using structural magnetic
      resonance imaging, motivated by assisted-living and elderly-care settings
      where earlier identification of progression supports planning and
      intervention.

      ## Approach

      The central idea is multi-view analysis of structural MRI. Rather than
      relying on a single slice orientation, the method exploits the
      complementary information available across the standard orthogonal
      acquisition planes - axial, coronal and sagittal - which is the same
      multi-view premise pursued in the author's subsequent AD-TriFuseViT
      framework, where the three orientations are combined through a learned
      fusion mechanism instead of being treated as independent samples.

      ## Position in the literature

      The paper sits in the MCI-to-AD conversion prediction literature, where
      the key methodological concerns are subject-level rather than
      slice-level evaluation, avoidance of data leakage from the same patient
      appearing in both training and validation folds, and the use of
      multi-modal or multi-view evidence to improve sensitivity to early
      neurodegenerative change. It was published in Image and Vision Computing
      (Q1, top decile of its field, impact factor 4.2) as volume 157, article
      105491.
